name: Media stack checks
on:
  push:
    paths: ['truenas-file-structure.sh', '*windows*', 'connect-drive.ps1', 'stack.ps1', 'compose*.yml', 'windows/**', 'portal/**', 'tests/**', '.github/workflows/media-stack.yml']
  pull_request:
    paths: ['truenas-file-structure.sh', '*windows*', 'connect-drive.ps1', 'stack.ps1', 'compose*.yml', 'windows/**', 'portal/**', 'tests/**', '.github/workflows/media-stack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n truenas-file-structure.sh && bash -n windows/entrypoint.sh
      - run: python3 -m unittest discover -s tests -v
      - run: node --check portal/static/app.js && node --check portal/static/cloud.js
      - run: node tests/test_hub.js
      - name: Generate portable setup and check Bash syntax
        run: python3 windows/build_configure.py | bash -n
      - name: Parse PowerShell and prepare direct mode
        shell: pwsh
        run: |
          foreach ($file in @('bootstrap-windows.ps1','install-windows.ps1','connect-drive.ps1','stack.ps1')) {
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
          ./install-windows.ps1 -InstallDir "$PWD/.test-output/install" -MediaPath "$PWD/.test-output/media" -Vpn Off -Remote Off -GenerateOnly
          ./tests/test_windows.ps1
          ./tests/test_bootstrap.ps1
          ./tests/test_windows_docker.ps1
      - name: Compose direct and VPN variants
        env:
          MEDIA_PATH: /tmp/media-stack-ci
          ADMIN_PASS: ci-only-not-a-real-secret
        run: |
          docker compose -f compose.windows.yml -f compose.direct.yml config --quiet
          docker compose -f compose.windows.yml -f compose.vpn.yml config --quiet
          docker compose -f compose.windows.yml --profile setup build setup
          docker compose -f compose.windows.yml build dashboard
          docker build -f portal/Dockerfile.archive -t sala-archive-check .
      - name: Archive smoke test with real rclone and synthetic Telegram
        run: docker run --rm -v "$PWD:/checks:ro" --entrypoint python sala-archive-check /checks/tests/smoke_archive.py
      - name: Validate browser-login config with official cloudflared
        env:
          MEDIA_PATH: /tmp/media-stack-ci
          ADMIN_PASS: ci-only-not-a-real-secret
        run: docker compose -f compose.windows.yml --profile setup run --rm --no-deps -v "$PWD:/checks:ro" setup python3 /checks/tests/check_cloudflare_config.py
      - name: Direct mode torrent smoke test
        env:
          MEDIA_PATH: ${{ github.workspace }}/.test-output/media
          ADMIN_PASS: ci-only-not-a-real-secret
          VPN_ENABLED: 'false'
        run: |
          mkdir -p "$MEDIA_PATH/downloads"
          chmod -R 777 "$MEDIA_PATH"
          docker compose -f compose.windows.yml -f compose.direct.yml up -d qbittorrent
          python3 tests/smoke_direct.py
      - name: Diagnostics
        if: failure()
        run: docker logs qbittorrent || true
      - name: Cleanup
        if: always()
        env:
          MEDIA_PATH: /tmp/media-stack-ci
          ADMIN_PASS: ci-only-not-a-real-secret
        run: docker compose -f compose.windows.yml -f compose.direct.yml down
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 regressions
        shell: powershell
        run: |
          ./tests/test_bootstrap.ps1
          ./tests/test_windows.ps1
          ./tests/test_windows_docker.ps1
  telegram-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether the pinned Telegram image changed
        id: telegram-source
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ] || git diff --name-only HEAD^ HEAD | rg -q '^portal/Dockerfile.telegram$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build pinned official Telegram Bot API source
        if: steps.telegram-source.outputs.changed == 'true'
        run: |
          docker build -f portal/Dockerfile.telegram -t sala-telegram-check .
          docker run --rm sala-telegram-check --help
